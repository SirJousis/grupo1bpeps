ServerName localhost
FileEtag None

<VirtualHost *:80>
    ProxyPass /api/ http://pythonb1:5000/api/
    ProxyPassReverse /api/ http://pythonb1:5000/api/

    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} ^(TRACE|TRACK|OPTIONS)
    RewriteRule .* - [F]

    RequestHeader set Server "Apache"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

    DocumentRoot /var/www/html/
    <Directory /var/www/html/>
        DirectoryIndex index.html
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        <LimitExcept POST GET>
            Deny from all
        </LimitExcept>
    </Directory>

    LogFormat "%v %h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" \"%{X-Forwarded-For}i\" %D" extended
    CustomLog /proc/self/fd/1 extended
    ErrorLog /proc/self/fd/2
    LogLevel warn
</VirtualHost>